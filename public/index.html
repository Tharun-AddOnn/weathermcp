<h1>Weather MCP server</h1>
<p>This host serves a Model Context Protocol endpoint at <code>/mcp</code>.</p>
<p>It runs stateless, so it answers tool calls but cannot show interactive prompts.
Point an MCP client at <code>/mcp</code>; check <code>/health</code> for status.</p>
