# Netlify deployment for the weather MCP server.
#
# IMPORTANT: this runs the server in stateless, conversational-only mode.
# Serverless functions cannot hold a connection open between requests, so MCP
# sessions and elicitation are both impossible here. The model asks "which
# city?" in chat instead of a popup appearing. See DEPLOY.md.

[build]
  command = "npm ci && npm run build"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  # Bundle the compiled server with the function.
  included_files = ["dist/**"]

[[headers]]
  for = "/mcp*"
  [headers.values]
    Cache-Control = "no-store"
